<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Masuk — AI Guru</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1b2421;--muted:#5d6b66;--line:#dbe2df;--acc:#0f766e;--acc2:#0b5c56;--err:#b42318;--errbg:#fdecea}
@media(prefers-color-scheme:dark){:root{--bg:#101614;--card:#18211e;--ink:#e7eeeb;--muted:#9aaba5;--line:#2b3934;--acc:#2dd4bf;--acc2:#5eead4;--errbg:#3a1714}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:4px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#06201c}}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:9px 12px;border-radius:8px;background:var(--errbg);color:var(--err);font-size:14px}
.msg[hidden]{display:none}
.msg.info{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.foot{margin-top:18px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <div class="brand"><div class="mark">✎</div>AI Guru</div>
  <p>Masukkan token akses yang diberikan admin.</p>
  <form id="f" autocomplete="off">
    <label for="t">Token akses</label>
    <input id="t" placeholder="GURU-XXXX-XXXX-XXXX-XXXX" required autocapitalize="characters" spellcheck="false">
    <button id="b" type="submit">Masuk</button>
  </form>
  <div id="m" class="msg" hidden></div>
  <div class="foot">Belum punya token? Hubungi admin sekolah.</div>
</main>
<script>
const m = document.getElementById('m'), b = document.getElementById('b');
function show(t, info){ m.textContent = t; m.className = 'msg' + (info ? ' info' : ''); m.hidden = false; }
const r = new URLSearchParams(location.search).get('r');
if (r === 'habis') show('Sesi berakhir atau token tidak berlaku lagi. Masukkan token yang aktif.');
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault(); m.hidden = true; b.disabled = true; b.textContent = 'Memeriksa…';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: document.getElementById('t').value }) });
    const d = await res.json().catch(() => ({}));
    if (res.ok && d.ok) { location.href = '/app'; return; }
    show(d.error || 'Gagal masuk. Coba lagi.');
  } catch { show('Tidak bisa terhubung. Periksa koneksi internet.'); }
  b.disabled = false; b.textContent = 'Masuk';
});
</script>
</body>
</html>
